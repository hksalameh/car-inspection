name: Add guided day 2 session
on:
  push:
    paths:
      - '.github/workflows/add-day2-session.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch second session
        run: python .github/scripts/add_day2_session.py
      - name: Commit changes
        run: |
          if git diff --quiet index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "hksalameh"
          git config user.email "hksalameh@gmail.com"
          git add index.html
          git commit -m "Add guided second AI workshop session"
          git push
