name: Add practical AI demo
on:
  push:
    paths:
      - '.github/workflows/add-practical-ai-demo.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply practical demo patch
        run: python scripts/patch_practical_demo.py
      - name: Commit changes
        run: |
          if git diff --quiet index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "hksalameh"
          git config user.email "hksalameh@gmail.com"
          git add index.html
          git commit -m "Add practical AI life demo"
          git push
